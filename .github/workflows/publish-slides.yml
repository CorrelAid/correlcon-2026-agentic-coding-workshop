name: Publish slides

on:
  push:
    branches: [main]
    paths: ["agentic-coding-talk/**", ".github/workflows/publish-slides.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: quarto-dev/quarto-actions/setup@v2
      - uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
          path: agentic-coding-talk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
