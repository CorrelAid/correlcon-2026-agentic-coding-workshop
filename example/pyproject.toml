[project]
name = "project"
version = "0.1.0"
description = "CorrelCon 2026 example: data project with a coding agent and an EU-hosted LLM"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "geopandas>=1.2.0",
    "lingua-language-detector>=2.1.1",
    "openai>=1.50",
    "pandas>=2.2",
    "plotly>=7.1.0",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
]

[project.scripts]
agent = "project.agent:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/project"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
