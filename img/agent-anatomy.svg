<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="540" viewBox="0 0 1200 540" font-family="Inter, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0f7c8c"/>
    </marker>
    <marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1d2433"/>
    </marker>
  </defs>

  <!-- AGENT bracket -->
  <path d="M20,48 V30 H1180 V48" fill="none" stroke="#e07a2f" stroke-width="3"/>
  <rect x="390" y="12" width="420" height="36" rx="18" fill="#fbfaf7"/>
  <text x="600" y="38" text-anchor="middle" font-size="21" font-weight="800" fill="#b65a17">ONE AGENT = goal + model + harness</text>

  <!-- goal -->
  <rect x="20" y="215" width="170" height="120" rx="14" fill="#fff" stroke="#1d2433" stroke-width="2"/>
  <text x="105" y="258" text-anchor="middle" font-size="13" font-weight="800" fill="#0f7c8c" letter-spacing="1.5">GOAL</text>
  <text x="105" y="286" text-anchor="middle" font-size="18" font-weight="800" fill="#1d2433">from you</text>
  <text x="105" y="310" text-anchor="middle" font-size="14" fill="#5b6577">what is “done”?</text>
  <path d="M190,275 H256" stroke="#1d2433" stroke-width="2.5" marker-end="url(#ak)"/>

  <!-- harness -->
  <rect x="260" y="70" width="920" height="450" rx="20" fill="#eef6f7" stroke="#0f7c8c" stroke-width="2.5" stroke-dasharray="9 6"/>
  <text x="288" y="106" font-size="18" font-weight="800" fill="#0f7c8c" letter-spacing="2">HARNESS</text>
  <text x="400" y="106" font-size="15" fill="#5b6577">the software around the model · Claude Code, Codex, OpenCode, Vibe …</text>

  <!-- model -->
  <rect x="300" y="190" width="270" height="170" rx="16" fill="#1d2433"/>
  <text x="435" y="232" text-anchor="middle" font-size="13" font-weight="800" fill="#7fc4cd" letter-spacing="1.5">MODEL (LLM)</text>
  <text x="435" y="268" text-anchor="middle" font-size="18" font-weight="700" fill="#fff">predicts the next token</text>
  <text x="435" y="296" text-anchor="middle" font-size="15" fill="#cfd6e2">only writes text –</text>
  <text x="435" y="318" text-anchor="middle" font-size="15" fill="#cfd6e2">including tool calls</text>

  <!-- tools -->
  <rect x="860" y="135" width="290" height="280" rx="16" fill="#fff" stroke="#0f7c8c" stroke-width="2.5"/>
  <text x="884" y="170" font-size="13" font-weight="800" fill="#0f7c8c" letter-spacing="1.5">TOOLS</text>
  <text x="884" y="194" font-size="15" fill="#5b6577">functions the model may call</text>
  <g font-size="16" font-family="JetBrains Mono, monospace" fill="#1d2433">
    <rect x="884" y="212" width="116" height="38" rx="8" fill="#eef6f7"/><text x="942" y="237" text-anchor="middle">read</text>
    <rect x="1012" y="212" width="116" height="38" rx="8" fill="#eef6f7"/><text x="1070" y="237" text-anchor="middle">edit</text>
    <rect x="884" y="262" width="116" height="38" rx="8" fill="#eef6f7"/><text x="942" y="287" text-anchor="middle">bash</text>
    <rect x="1012" y="262" width="116" height="38" rx="8" fill="#eef6f7"/><text x="1070" y="287" text-anchor="middle">grep</text>
    <rect x="884" y="312" width="116" height="38" rx="8" fill="#eef6f7"/><text x="942" y="337" text-anchor="middle">web</text>
    <rect x="1012" y="312" width="116" height="38" rx="8" fill="#eef6f7"/><text x="1070" y="337" text-anchor="middle">MCP</text>
  </g>
  <text x="1005" y="392" text-anchor="middle" font-size="14" fill="#5b6577">run by the harness, not the model</text>

  <!-- loop arrows -->
  <path d="M575,225 C660,150 780,150 855,205" fill="none" stroke="#0f7c8c" stroke-width="3.5" marker-end="url(#aa)"/>
  <text x="715" y="152" text-anchor="middle" font-size="16" font-weight="700" fill="#0f7c8c">tool call</text>
  <path d="M855,345 C780,400 660,400 575,325" fill="none" stroke="#0f7c8c" stroke-width="3.5" marker-end="url(#aa)"/>
  <text x="715" y="410" text-anchor="middle" font-size="16" font-weight="700" fill="#0f7c8c">result → back into context</text>
  <text x="715" y="262" text-anchor="middle" font-size="13" font-weight="800" fill="#0f7c8c" letter-spacing="1.5">AGENTIC LOOP</text>
  <text x="715" y="300" text-anchor="middle" font-size="34" font-weight="800" fill="#0f7c8c">↻</text>
  <text x="715" y="326" text-anchor="middle" font-size="14" fill="#5b6577">repeats until done</text>

  <!-- harness strip -->
  <rect x="290" y="448" width="860" height="48" rx="12" fill="#fff" stroke="#dfe3ea" stroke-width="1.5"/>
  <text x="720" y="479" text-anchor="middle" font-size="16" fill="#1d2433"><tspan font-weight="700">also the harness:</tspan> context · permissions · hooks · UI · <tspan fill="#b65a17" font-weight="700">runs many agents at once (subagents, sessions)</tspan></text>
</svg>
