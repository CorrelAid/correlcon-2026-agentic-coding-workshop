<svg xmlns="http://www.w3.org/2000/svg" width="620" height="460" viewBox="0 0 620 460" font-family="Inter, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1d2433"/>
    </marker>
    <marker id="eo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#e07a2f"/>
    </marker>
  </defs>
  <!-- repo frame -->
  <rect x="10" y="10" width="600" height="440" rx="16" fill="#eef6f7" stroke="#0f7c8c" stroke-width="2.5" stroke-dasharray="8 6"/>
  <text x="34" y="44" font-size="17" font-weight="800" fill="#0f7c8c" letter-spacing="2">ONE REPO</text>

  <!-- entry points -->
  <g>
    <rect x="40" y="70" width="230" height="86" rx="12" fill="#fff" stroke="#1d2433" stroke-width="2"/>
    <text x="60" y="100" font-size="13" font-weight="800" fill="#0f7c8c" letter-spacing="1">ENTRY POINT 1</text>
    <text x="60" y="130" font-size="20" font-weight="800" fill="#1d2433">App A</text>
  </g>
  <g>
    <rect x="350" y="70" width="230" height="86" rx="12" fill="#fff" stroke="#1d2433" stroke-width="2"/>
    <text x="370" y="100" font-size="13" font-weight="800" fill="#0f7c8c" letter-spacing="1">ENTRY POINT 2</text>
    <text x="370" y="130" font-size="20" font-weight="800" fill="#1d2433">App B</text>
  </g>

  <!-- shared code -->
  <rect x="195" y="220" width="230" height="80" rx="12" fill="#1d2433"/>
  <text x="310" y="255" text-anchor="middle" font-size="20" font-weight="800" fill="#fff">Shared code</text>
  <text x="310" y="281" text-anchor="middle" font-size="14" fill="#ffc79a">change here → test all three</text>

  <!-- data prep -->
  <rect x="195" y="350" width="230" height="80" rx="12" fill="#fff" stroke="#1d2433" stroke-width="2"/>
  <text x="215" y="378" font-size="13" font-weight="800" fill="#0f7c8c" letter-spacing="1">ENTRY POINT 3</text>
  <text x="215" y="408" font-size="18" font-weight="800" fill="#1d2433">Dev-data preparation</text>

  <!-- arrows -->
  <path d="M155,156 L250,216" stroke="#1d2433" stroke-width="2.5" fill="none" marker-end="url(#e)"/>
  <path d="M465,156 L370,216" stroke="#1d2433" stroke-width="2.5" fill="none" marker-end="url(#e)"/>
  <path d="M310,350 V304" stroke="#1d2433" stroke-width="2.5" fill="none" marker-end="url(#e)"/>
  <!-- dev data feeds apps -->
  <path d="M195,390 H80 V160" stroke="#e07a2f" stroke-width="2.5" stroke-dasharray="7 5" fill="none" marker-end="url(#eo)"/>
  <path d="M425,390 H540 V160" stroke="#e07a2f" stroke-width="2.5" stroke-dasharray="7 5" fill="none" marker-end="url(#eo)"/>
  <text x="92" y="330" font-size="13.5" fill="#b65a17" font-weight="700">dev data</text>
  <text x="472" y="330" font-size="13.5" fill="#b65a17" font-weight="700">dev data</text>

</svg>
